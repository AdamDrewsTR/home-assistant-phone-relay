name: Validate
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - run: pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: terraform init -backend=false -input=false
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform test
      - run: docker build -t ha-phone-relay:test addon

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r tests/ha_runtime/requirements.txt
      - run: python -m unittest discover -s tests/ha_runtime -v
