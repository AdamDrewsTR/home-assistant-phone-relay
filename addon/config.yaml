name: Phone Relay
version: "0.1.0"
slug: phone_relay
description: Outbound-only Companion phone location and sensor relay
url: https://github.com/AdamDrewsTR/home-assistant-phone-relay
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:cellphone-marker
panel_title: Phone Relay
options:
  websocket_url: ""
  connector_key: ""
  supervisor_ingress: true
schema:
  websocket_url: url
  connector_key: password
  supervisor_ingress: bool
watchdog: http://[HOST]:8099/health
